[project]
name = "extraceval"
version = "0.1.0"
description = "Run PDF-to-text tools side by side on your own documents and compare speed and quality."
readme = "README.md"
authors = [
    { name = "Fabian Simonjetz", email = "fsimonjetz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    # extraction tools
    "docling>=2.0",
    "pdfminer.six>=20240706",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "pymupdf4llm>=0.2",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
]

[project.scripts]
extraceval = "extraceval.cli:app"

[project.entry-points."extraceval.extractors"]
pypdfium2 = "extraceval.extractors.pypdfium2:Pypdfium2"
pypdf = "extraceval.extractors.pypdf:Pypdf"
pymupdf = "extraceval.extractors.pymupdf:PyMuPDF"
pdfplumber = "extraceval.extractors.pdfplumber:Pdfplumber"
pdfminer = "extraceval.extractors.pdfminer:Pdfminer"
docling = "extraceval.extractors.docling:Docling"
pymupdf4llm = "extraceval.extractors.pymupdf4llm:PyMuPDF4LLM"

[dependency-groups]
dev = [
    "fpdf2>=2.7",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pypdfium2.*", "pymupdf.*", "pymupdf4llm.*", "pdfplumber.*", "pdfminer.*", "docling.*", "fpdf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["extraceval.extractors.*"]
disallow_untyped_calls = false  # wrapped PDF libraries are often only partially typed

[tool.pytest.ini_options]
testpaths = ["tests"]
